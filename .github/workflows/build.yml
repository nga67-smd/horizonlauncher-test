name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: horizon-next.exe
            out: horizon-next-windows.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: horizon-next
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Build
        run: cargo build --release
      - name: Rename binary
        shell: bash
        run: cp "target/release/${{ matrix.built }}" "${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: horizon-next/${{ matrix.out }}
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: horizon-next/${{ matrix.out }}
