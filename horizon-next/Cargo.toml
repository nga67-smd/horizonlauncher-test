[package]
name = "horizon-next"
version = "0.1.0"
edition = "2021"
description = "A Minecraft launcher with a redesigned UI, written in Rust"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
directories = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
strip = true
